services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      # Variables de Laravel: usan lo que provea la plataforma de despliegue
      # (p. ej. Coolify) si está definido, y si no caen en un default sensato.
      # No dependen de un archivo .env en el repo (no se versiona ninguno).
      APP_NAME: ${APP_NAME:-Pro Encuestas}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-es}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-encuestas}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      # Postgres no se expone fuera de la red interna de Docker (sin "ports:"
      # abajo), así que un default aquí es un riesgo bajo; aun así, sobrescribe
      # DB_PASSWORD en tu plataforma de despliegue en cuanto puedas.
      DB_PASSWORD: ${DB_PASSWORD:-changeme-in-production}
      APP_KEY: ${APP_KEY:?Debes definir APP_KEY (php artisan key:generate --show)}
      VITE_APP_API_HOST: ${VITE_APP_API_HOST:-http://localhost:8000/api/}
    ports:
      - "80"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-encuestas}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme-in-production}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-encuestas}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
  app_storage:
  app_logs:
