name: pro_encuestas_mobile
description: App de encuestadores para el sistema de encuestas de la Alcaldía de Cumaná — llenado offline, sincronización posterior.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.0

  # Almacenamiento local relacional (encuestas cacheadas + cola de instancias)
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Almacenamiento seguro (solo el token de sesión)
  flutter_secure_storage: ^9.2.2

  # Red
  dio: ^5.6.0

  # Conectividad (para disparar la sincronización automática)
  connectivity_plus: ^6.0.5

  # Identificadores locales de instancia (idempotencia al subir)
  uuid: ^4.4.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
